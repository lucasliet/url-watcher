name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores da mesma branch quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Deno test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar cache de dependências
        # --allow-import é necessário porque grammy@1.17.2 importa transitivamente
        # de cdn.skypack.dev em platform.deno.ts. Sem a flag, deno cache falha.
        run: deno cache --allow-import main.ts

      - name: Formatar (check)
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check --allow-import main.ts

      - name: Testes unitários
        run: deno task test
        env:
          # Defesa em profundidade: mesmo que um teste esqueça de mockar notify,
          # as env vars vazias garantem que grammy não tenha token/userId para
          # disparar mensagens reais no Telegram. A proteção principal é o stub
          # NotifyFn injetado via createApp({ notify }) em tests/server.test.ts.
          TELEGRAM_CHAT_BOT_TOKEN: ''
          TELEGRAM_USER_ID: ''
          # URLs de teste controladas (não há fetch real pois o test stub globalThis.fetch).
          WATCH_URLS: 'https://test.example.com/watched'
